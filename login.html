<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход в админку</title>
  <meta name="robots" content="noindex" />
  <style>
    @font-face{font-family:"KZGoodVibes";src:url(https://www.chakyruu24.kg/fonts/kz_fon_1/KZGoodVibes.woff2)format("woff2");font-display:swap}
    @font-face{font-family:"TildaSans-Regular";src:url(https://www.chakyruu24.kg/fonts/tilda/TildaSans-Regular.woff2)format("woff2");font-display:swap}
    :root{--bg:#fff8ed;--ink:#3d2314;--muted:#8a7a6e;--accent:#8d0c0c;--line:rgba(61,35,20,.15)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font-family:"TildaSans-Regular",-apple-system,"Segoe UI",Roboto,sans-serif}
    .card{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:32px 28px 28px;box-shadow:0 10px 40px rgba(61,35,20,.08)}
    h1{font-family:KZGoodVibes,cursive;font-weight:400;font-size:46px;margin:0;text-align:center}
    .sub{color:var(--muted);font-size:14px;text-align:center;margin:4px 0 26px}
    label{display:block;margin-bottom:16px}
    label span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:16px;line-height:normal;color:var(--ink);background:#fff;outline:none}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(141,12,12,.1)}
    button{width:100%;height:50px;margin-top:6px;border:0;border-radius:25px;background:var(--accent);color:#fff;font:inherit;font-size:16px;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}
    .error{min-height:20px;margin:12px 0 0;color:var(--accent);font-size:14px;text-align:center}
    .back{display:block;margin-top:18px;text-align:center;color:var(--muted);font-size:14px;text-decoration:none}
    .back:hover{color:var(--accent)}
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>Админка</h1>
    <p class="sub">Кыз узатуу · Айзирек</p>
    <label><span>Логин</span><input name="login" autocomplete="username" autocapitalize="none" required autofocus /></label>
    <label><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required /></label>
    <button type="submit" id="submit">Войти</button>
    <p class="error" id="error" role="alert"></p>
    <a class="back" href="/">← К приглашению</a>
  </form>
  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('submit');
    const error = document.getElementById('error');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Вход…';
      error.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: form.login.value, password: form.password.value })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) return location.replace('/admin');
        error.textContent = data.error || 'Не удалось войти';
        form.password.select();
      } catch (err) {
        error.textContent = 'Нет связи с сервером';
      }
      btn.disabled = false;
      btn.textContent = 'Войти';
    });
  </script>
</body>
</html>
